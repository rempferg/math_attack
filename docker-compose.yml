services:
  web:
    build: .
    restart: "no"
    ports:
      - "127.0.0.1:${WEB_PORT:?set WEB_PORT in .env or the environment}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s